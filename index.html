              <li>DDD</li>

          </li>
          <li class="slider__slide active-slide">
            Slider 2
          </li>
          <li class="slider__slide next-slide">
            Slider 3
          </li>
          <li class="slider__slide">
            Slider 4
          </li>
          <li class="slider__slide">
            Slider 5
          </li>
          <li class="slider__slide">
            Slider 6
          </li>

      </div>
